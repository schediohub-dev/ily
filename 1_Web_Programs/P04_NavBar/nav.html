<html>
<head>
<style>
ul { list-style: none; margin: 0; padding: 0; background: #333; }
li { display: inline-block; position: relative; }
a { display: block; padding: 12px; color: white; text-decoration: none; }
li ul { display: none; position: absolute; min-width: 120px; }
li:hover ul { display: block; }
li ul li { display: block; }
</style>
</head>
<body>
<ul>
  <li><a href="#">Home</a></li>
  <li><a href="#">Products</a>
    <ul>
      <li><a href="#">Mobiles</a></li>
      <li><a href="#">Laptops</a></li>
    </ul>
  </li>
  <li><a href="#">Services</a>
    <ul>
      <li><a href="#">Repair</a></li>
      <li><a href="#">Delivery</a></li>
    </ul>
  </li>
  <li><a href="#">Contact</a></li>
</ul>
</body>
</html>
